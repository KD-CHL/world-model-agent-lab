[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "world-model-agent-lab"
version = "0.0.1"
description = "API task agent, world-model planning and ROS 2 robot interfaces"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
simulation = ["mujoco>=3.2,<4", "numpy>=1.26,<3"]
learning = ["numpy>=1.26,<3", "torch>=2.2"]

[project.scripts]
wmal-agent = "wmal.agents.cli:run_agent"
wmal-serve = "wmal.agents.cli:serve"
wmal-train-neural = "wmal.training.cli:train_neural_cli"

[tool.setuptools.packages.find]
where = ["src"]
